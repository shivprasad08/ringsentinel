<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RingSentinel — Case Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E141B;
    --panel: #161E27;
    --panel-raised: #1B2530;
    --hairline: #26313D;
    --text: #E7ECF1;
    --text-dim: #7E8FA0;
    --text-faint: #4B5A69;
    --amber: #D98E3B;
    --amber-dim: #6B5029;
    --teal: #4FA0A0;
    --danger: #C4432B;
    --danger-bg: #2A1D15;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .display { font-family: 'Barlow Condensed', sans-serif; }

  header {
    border-bottom: 1px solid var(--hairline);
    padding: 20px 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .brand h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.02em;
    margin: 0;
    text-transform: uppercase;
  }
  .brand .tag {
    font-size: 11px;
    color: var(--text-dim);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    padding: 2px 7px;
    letter-spacing: 0.04em;
  }
  .status-line { display: flex; align-items: center; gap: 18px; font-size: 13px; color: var(--text-dim); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); display: inline-block; margin-right: 6px; }
  .status-dot.ok { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
  .status-dot.err { background: #C4432B; box-shadow: 0 0 6px #C4432B; }
  .eyebrow { color: var(--amber); font-weight: 600; }

  main { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .queue {
    border-right: 1px solid var(--hairline);
    overflow-y: auto;
    padding: 14px 0;
  }
  .queue-head { padding: 0 20px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); }
  .threshold-control {
    padding: 10px 20px 14px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 6px;
  }
  .threshold-control label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-dim); margin-bottom: 6px;
  }
  .threshold-control .threshold-val {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;
    color: var(--amber); min-width: 36px; text-align: right;
  }
  .threshold-control input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--teal), var(--amber));
    outline: none; cursor: pointer;
  }
  .threshold-control input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--amber); border: 2px solid var(--bg);
    box-shadow: 0 0 6px rgba(217,142,59,0.4);
  }
  .threshold-control input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--amber); border: 2px solid var(--bg);
    box-shadow: 0 0 6px rgba(217,142,59,0.4);
  }
  .threshold-control .threshold-hint {
    font-size: 10px; color: var(--text-faint); margin-top: 4px;
  }
  .queue-search {
    padding: 0 20px 12px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 6px;
  }
  .queue-search input {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--hairline);
    border-radius: 4px; padding: 8px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  }
  .queue-search input:focus { outline: none; border-color: var(--amber-dim); }
  .case-row {
    padding: 12px 20px;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: background 0.12s ease;
  }
  .case-row:hover { background: var(--panel); }
  .case-row.active { background: var(--panel-raised); border-left: 3px solid var(--amber); padding-left: 17px; }
  .seal {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1.5px dashed var(--amber-dim);
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
    color: var(--amber); flex-shrink: 0;
  }
  .case-row-info { min-width: 0; }
  .case-row-id { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .case-row-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .queue-badge,
  .decision-pill {
    display: inline-flex; align-items: center; height: 18px; border-radius: 3px;
    padding: 0 6px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; line-height: 1;
    border: 1px solid var(--hairline); color: var(--text-dim);
  }
  .queue-badge { color: var(--amber); border-color: var(--amber-dim); }
  .decision-pill.confirmed { color: var(--danger); border-color: var(--danger); background: rgba(196, 67, 43, 0.08); }
  .decision-pill.false-positive { color: var(--teal); border-color: var(--teal); background: rgba(79, 160, 160, 0.08); }
  .decision-pill.needs-info { color: var(--amber); border-color: var(--amber-dim); background: rgba(217, 142, 59, 0.08); }

  .detail { padding: 28px 32px; overflow-y: auto; display: flex; flex-direction: column; }
  .empty-state { color: var(--text-dim); font-size: 14px; text-align: center; margin: auto; }
  .empty-state .big { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; color: var(--text); display: block; margin-bottom: 8px; }

  .case-header { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
  .seal-lg {
    width: 76px; height: 76px; border-radius: 50%;
    border: 2px dashed var(--amber);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--amber); flex-shrink: 0; transform: rotate(-4deg);
  }
  .seal-lg .score { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; }
  .seal-lg .label { font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }
  .case-title h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.02em; }
  .action-badge {
    display: inline-block; background: var(--danger-bg); color: var(--amber);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 3px 9px;
    border-radius: 3px; border: 1px solid var(--amber-dim); letter-spacing: 0.03em;
  }
  .method-badge {
    display: inline-block; color: var(--teal); border-color: var(--teal);
    background: rgba(79, 160, 160, 0.08); margin-left: 6px;
  }

  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); margin: 28px 0 12px; }
  .ledger { width: 100%; border-collapse: collapse; font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .ledger td { padding: 7px 0; border-bottom: 1px solid var(--hairline); }
  .ledger td:first-child { color: var(--text-dim); width: 55%; }
  .ledger td:last-child { text-align: right; color: var(--text); }
  .ledger tr.anom td:last-child { color: var(--amber); }

  .evidence-list { list-style: none; padding: 0; margin: 0; }
  .evidence-list li {
    padding: 10px 14px; background: var(--panel); border: 1px solid var(--hairline);
    border-radius: 4px; margin-bottom: 8px; font-size: 13px;
  }
  .evidence-list .sig { color: var(--amber); font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .evidence-list .eid { color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .ai-narrative {
    padding: 10px 14px; background: var(--panel); border: 1px solid var(--hairline);
    border-radius: 4px; font-size: 13px; line-height: 1.55;
  }
  .ai-narrative.loading,
  .ai-narrative.fallback { color: var(--text-dim); font-style: italic; }
  .ai-narrative.fallback { border-color: var(--amber-dim); }

  #graph-wrap { background: var(--panel); border: 1px solid var(--hairline); border-radius: 6px; padding: 16px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .chip { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); border: 1px solid var(--hairline); border-radius: 3px; padding: 3px 8px; }

  .score-tool { background: var(--panel); border: 1px solid var(--hairline); border-radius: 6px; padding: 18px 20px; margin-top: 32px; }
  .score-tool h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.02em; }
  .score-tool p { color: var(--text-dim); font-size: 13px; margin: 0 0 12px; }
  .score-tool textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--hairline);
    border-radius: 4px; padding: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    resize: vertical; min-height: 70px;
  }
  .score-tool button {
    margin-top: 10px; background: var(--amber); color: #1A1204; border: none; border-radius: 4px;
    padding: 8px 18px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;
    cursor: pointer; letter-spacing: 0.03em;
  }
  .score-tool button:disabled { opacity: 0.5; cursor: not-allowed; }
  #score-result { margin-top: 14px; font-size: 13px; }
  #score-result .err { color: #E27A5E; }

  .decisions-section { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--hairline); }
  .decision-actions { display: flex; gap: 10px; margin-bottom: 24px; }
  .btn-decision {
    background: var(--panel); border: 1px solid var(--hairline); color: var(--text);
    padding: 8px 16px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; cursor: pointer; transition: all 0.15s;
  }
  .btn-decision:hover { background: var(--panel-raised); border-color: var(--text-dim); }
  .btn-decision.fraud { border-color: var(--danger); color: var(--danger); }
  .btn-decision.fraud:hover { background: rgba(196, 67, 43, 0.1); }
  .btn-decision.fp { border-color: var(--teal); color: var(--teal); }
  .btn-decision.fp:hover { background: rgba(79, 160, 160, 0.1); }
  .decision-history { list-style: none; padding: 0; margin: 0; }
  .decision-history li {
    padding: 12px; background: var(--panel); border-left: 3px solid var(--text-dim);
    margin-bottom: 8px; font-size: 13px;
  }
  .decision-history li.fraud { border-left-color: var(--danger); }
  .decision-history li.fp { border-left-color: var(--teal); }
  .decision-history .meta { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; font-family: 'IBM Plex Mono', monospace; }
  .decision-history .note { font-style: italic; color: var(--text-faint); margin-top: 6px; }

  a { color: var(--teal); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>RingSentinel</h1>
    <span class="tag">CASE QUEUE</span>
  </div>
  <div class="status-line">
    <span><span id="status-dot" class="status-dot"></span><span id="status-text">connecting…</span></span>
    <span><span class="eyebrow" id="case-count">–</span> open cases</span>
  </div>
</header>

<main>
  <nav class="queue" id="queue" aria-label="Flagged case queue">
    <div class="queue-head">Flagged clusters, highest risk first</div>
    <div class="queue-search">
      <input type="search" id="case-search" placeholder="Search cluster ID" aria-label="Search cluster ID">
    </div>
    <div class="threshold-control">
      <label for="threshold-slider">
        Decision threshold
        <span class="threshold-val" id="threshold-val">0.50</span>
      </label>
      <input type="range" id="threshold-slider" min="0" max="1" step="0.01" value="0.50">
      <div class="threshold-hint">Cases below this threshold are marked NOT_FLAGGED</div>
    </div>
    <div id="queue-list"></div>
  </nav>

  <section class="detail" id="detail">
    <div class="empty-state">
      <span class="big">No case selected</span>
      Choose a flagged cluster from the queue to review its evidence.
    </div>
  </section>
</main>

<script>
const API_BASE = window.location.hash.slice(1) || 'http://127.0.0.1:8000';

const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const caseCount = document.getElementById('case-count');
const queueList = document.getElementById('queue-list');
const detail = document.getElementById('detail');
const caseSearch = document.getElementById('case-search');

let cases = [];
let allCases = [];  // unfiltered copy from API
let activeId = null;

function getThreshold() {
  return parseFloat(document.getElementById('threshold-slider').value);
}

function getSearchQuery() {
  return caseSearch.value.trim().toLowerCase();
}

function decisionPill(decision) {
  if (decision === 'confirmed_fraud') {
    return '<span class="decision-pill confirmed">Confirmed</span>';
  }
  if (decision === 'false_positive') {
    return '<span class="decision-pill false-positive">False positive</span>';
  }
  if (decision === 'needs_more_info') {
    return '<span class="decision-pill needs-info">Needs info</span>';
  }
  return '';
}

function detectionMethodLabel(method) {
  const hasAnomaly = method.includes('anomaly_detection');
  const hasGbm = method.includes('gbm_ring_scorer');
  if (hasAnomaly && hasGbm) return 'GBM + Anomaly Detection';
  if (hasGbm) return 'GBM';
  if (hasAnomaly) return 'Anomaly Detection';
  return method.replaceAll('_', ' ');
}

async function fetchJSON(path, opts) {
  const res = await fetch(API_BASE + path, opts);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `${res.status} ${res.statusText}`);
  }
  return res.json();
}

async function boot() {
  try {
    const health = await fetchJSON('/health');
    statusDot.className = 'status-dot ok';
    statusText.textContent = `connected — ${API_BASE}`;
    allCases = await fetchJSON('/rings?limit=200');
    applyThresholdFilter();
  } catch (e) {
    statusDot.className = 'status-dot err';
    statusText.textContent = `cannot reach API (${e.message}) — set #http://host:port in the URL`;
  }
}

function applyThresholdFilter() {
  const threshold = getThreshold();
  const query = getSearchQuery();
  cases = allCases
    .filter(c => c.cluster_id.toLowerCase().includes(query))
    .map(c => ({
      ...c,
      action: c.risk_score >= threshold ? 'FLAGGED_FOR_HUMAN_REVIEW' : 'NOT_FLAGGED'
    }));
  const flaggedCount = cases.filter(c => c.action === 'FLAGGED_FOR_HUMAN_REVIEW').length;
  caseCount.textContent = flaggedCount;
  renderQueue();
}

function renderQueue() {
  queueList.innerHTML = '';
  cases.forEach(c => {
    const isFlagged = c.action === 'FLAGGED_FOR_HUMAN_REVIEW';
    const row = document.createElement('div');
    row.className = 'case-row' + (c.cluster_id === activeId ? ' active' : '');
    if (!isFlagged) row.style.opacity = '0.4';
    row.tabIndex = 0;
    row.setAttribute('role', 'button');
    row.innerHTML = `
      <div class="seal mono">${Math.round(c.risk_score * 100)}</div>
      <div class="case-row-info">
        <div class="case-row-id">${c.cluster_id}</div>
        <div class="case-row-meta">
          <span>${c.cluster_size} accounts</span>
          <span>${c.action === 'FLAGGED_FOR_HUMAN_REVIEW' ? 'FLAGGED' : 'not flagged'}</span>
          <span class="queue-badge">${c.detection_method_short}</span>
          ${decisionPill(c.latest_decision)}
        </div>
      </div>`;
    row.addEventListener('click', () => selectCase(c.cluster_id));
    row.addEventListener('keydown', e => { if (e.key === 'Enter') selectCase(c.cluster_id); });
    queueList.appendChild(row);
  });
}

async function selectCase(id) {
  activeId = id;
  renderQueue();
  detail.innerHTML = `<div class="empty-state">Loading case ${id}…</div>`;
  try {
    const [rec, decisions] = await Promise.all([
      fetchJSON(`/audit/${encodeURIComponent(id)}`),
      fetchJSON(`/audit/${encodeURIComponent(id)}/decisions`)
    ]);
    renderDetail(rec, decisions);
  } catch (e) {
    detail.innerHTML = `<div class="empty-state err">Could not load this case: ${e.message}</div>`;
  }
}

function featureLedgerRows(snapshot, anomalous) {
  const anomFeatures = new Set((anomalous || []).map(a => a.split('=')[0]));
  return Object.entries(snapshot).map(([k, v]) => {
    const isAnom = anomFeatures.has(k);
    return `<tr class="${isAnom ? 'anom' : ''}"><td>${k}</td><td>${typeof v === 'number' ? v.toFixed(3) : v}</td></tr>`;
  }).join('');
}

function drawEvidenceGraph(record) {
  const w = 560, h = 300, cx = w / 2, cy = h / 2;
  const evidence = record.shared_entity_evidence || [];
  const members = record.member_account_ids || [];

  const entityNodes = evidence.slice(0, 3).map((ev, i) => {
    const angle = (i / Math.max(evidence.length, 1)) * Math.PI * 2 - Math.PI / 2;
    return { ...ev, x: cx + Math.cos(angle) * 60, y: cy + Math.sin(angle) * 60 };
  });

  const linkedAccounts = new Set();
  entityNodes.forEach(e => e.accounts_sharing.forEach(a => linkedAccounts.add(a)));
  const shown = members.slice(0, 14);
  const accountNodes = shown.map((acc, i) => {
    const angle = (i / shown.length) * Math.PI * 2;
    const r = 130;
    return { id: acc, x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r, linked: linkedAccounts.has(acc) };
  });

  let edges = '';
  entityNodes.forEach(ent => {
    accountNodes.forEach(acc => {
      if (ent.accounts_sharing.includes(acc.id)) {
        edges += `<line x1="${ent.x}" y1="${ent.y}" x2="${acc.x}" y2="${acc.y}" stroke="#D98E3B" stroke-width="1" opacity="0.55"/>`;
      }
    });
  });

  let entitySvg = entityNodes.map(e => `
    <g>
      <rect x="${e.x - 9}" y="${e.y - 9}" width="18" height="18" fill="#0E141B" stroke="#D98E3B" stroke-width="1.5"
        transform="rotate(45 ${e.x} ${e.y})"/>
      <title>${e.signal}: ${e.entity_id}</title>
    </g>`).join('');

  let accountSvg = accountNodes.map(a => `
    <g>
      <circle cx="${a.x}" cy="${a.y}" r="5" fill="${a.linked ? '#4FA0A0' : '#26313D'}" stroke="${a.linked ? '#4FA0A0' : '#4B5A69'}"/>
      <title>${a.id}</title>
    </g>`).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;" role="img" aria-label="Evidence graph: shared entities connecting flagged accounts">
    ${edges}${entitySvg}${accountSvg}
  </svg>`;
}

window.submitDecision = async function(clusterId, decisionValue) {
  const note = prompt(`Enter optional note for decision: ${decisionValue}`);
  if (note === null) return; // cancelled

  try {
    const result = await fetchJSON(`/audit/${encodeURIComponent(clusterId)}/decision`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ decision: decisionValue, reviewer_note: note })
    });
    allCases = allCases.map(c => c.cluster_id === clusterId ? {
      ...c,
      latest_decision: result.decision_recorded.decision
    } : c);
    applyThresholdFilter();
    selectCase(clusterId);
  } catch (e) {
    alert(`Failed to record decision: ${e.message}`);
  }
};

async function loadNarrative(clusterId) {
  const box = document.getElementById('ai-narrative');
  if (!box) return;

  try {
    const result = await fetchJSON(`/audit/${encodeURIComponent(clusterId)}/narrative`);
    if (activeId !== clusterId) return;

    const narrative = result.narrative || '[Narrative unavailable: empty response.]';
    box.textContent = narrative;
    box.className = narrative.startsWith('[Narrative') ? 'ai-narrative fallback' : 'ai-narrative';
  } catch (e) {
    if (activeId !== clusterId) return;
    box.textContent = `[Narrative unavailable: ${e.message}.]`;
    box.className = 'ai-narrative fallback';
  }
}

function renderDetail(rec, decisions) {
  const evList = (rec.shared_entity_evidence || []).map(ev => `
    <li><span class="sig">${ev.signal}</span> — ${ev.accounts_sharing.length} accounts share <span class="eid">${ev.entity_id}</span></li>
  `).join('') || '<li>No shared device/instrument/address found — flagged on behavioral signal alone.</li>';

  const historyHtml = decisions.length ? `<ul class="decision-history">` + decisions.map(d => {
    let cls = '';
    if (d.decision === 'confirmed_fraud') cls = 'fraud';
    if (d.decision === 'false_positive') cls = 'fp';
    const dateStr = new Date(d.decided_at).toLocaleString();
    return `<li class="${cls}">
      <div class="meta">${dateStr} &middot; <strong>${d.decision}</strong></div>
      ${d.reviewer_note ? `<div class="note">"${d.reviewer_note}"</div>` : ''}
    </li>`;
  }).join('') + `</ul>` : '<div style="color:var(--text-faint);font-size:13px;font-style:italic;">No decisions recorded yet.</div>';

  detail.innerHTML = `
    <div class="case-header">
      <div class="seal-lg"><span class="score mono">${(rec.risk_score * 100).toFixed(0)}</span><span class="label">risk</span></div>
      <div class="case-title">
        <h2>${rec.cluster_id}</h2>
        <span class="action-badge">${rec.action}</span>
        <span class="action-badge method-badge">Detected via: ${detectionMethodLabel(rec.detection_method)}</span>
      </div>
    </div>

    <div class="section-label">Feature snapshot (amber = anomalous vs. candidate-population average)</div>
    <table class="ledger">${featureLedgerRows(rec.feature_snapshot, rec.anomalous_features)}</table>

    <div class="section-label">Evidence</div>
    <ul class="evidence-list">${evList}</ul>

    <div class="section-label">AI Case Summary</div>
    <div id="ai-narrative" class="ai-narrative loading">Generating summary...</div>

    <div class="section-label">Evidence graph — diamonds are shared infrastructure, dots are accounts (teal = linked)</div>
    <div id="graph-wrap">${drawEvidenceGraph(rec)}</div>

    <div class="section-label">Flagged accounts (${rec.member_account_ids.length})</div>
    <div class="chip-row">${rec.member_account_ids.map(a => `<span class="chip">${a}</span>`).join('')}</div>

    <div class="decisions-section">
      <div class="section-label" style="margin-top:0;">Record Decision</div>
      <div class="decision-actions">
        <button class="btn-decision fraud" onclick="submitDecision('${rec.cluster_id}', 'confirmed_fraud')">Confirmed fraud</button>
        <button class="btn-decision fp" onclick="submitDecision('${rec.cluster_id}', 'false_positive')">False positive</button>
        <button class="btn-decision" onclick="submitDecision('${rec.cluster_id}', 'needs_more_info')">Needs more info</button>
      </div>
      <div class="section-label">Decision History</div>
      ${historyHtml}
    </div>
  `;

  loadNarrative(rec.cluster_id);
}

// --- Live /score-ring tester ---
const scoreTool = document.createElement('div');
scoreTool.className = 'score-tool';
scoreTool.innerHTML = `
  <h3>Score a candidate group</h3>
  <p>Paste 2 or more account IDs (comma or newline separated) to score them on demand — this calls the live model, not a stored case.</p>
  <textarea id="score-input" placeholder="acc_xxxxxxxxxx, acc_xxxxxxxxxx, ..."></textarea>
  <br><button id="score-btn">Score group</button>
  <div id="score-result"></div>
`;
document.getElementById('queue').appendChild(scoreTool);

document.getElementById('score-btn').addEventListener('click', async () => {
  const btn = document.getElementById('score-btn');
  const resultBox = document.getElementById('score-result');
  const ids = document.getElementById('score-input').value.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
  if (ids.length < 2) {
    resultBox.innerHTML = '<span class="err">Need at least 2 account IDs.</span>';
    return;
  }
  btn.disabled = true;
  resultBox.textContent = 'Scoring…';
  try {
    const result = await fetchJSON('/score-ring', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account_ids: ids, decision_threshold: getThreshold() }),
    });
    resultBox.innerHTML = `
      <table class="ledger">
        <tr><td>risk_score</td><td>${result.risk_score}</td></tr>
        <tr><td>action</td><td>${result.action}</td></tr>
        <tr><td>shared evidence found</td><td>${result.shared_entity_evidence.length} entities</td></tr>
      </table>
      ${result.note ? `<p style="color:var(--text-dim);font-size:12px;margin-top:8px;">${result.note}</p>` : ''}
    `;
  } catch (e) {
    resultBox.innerHTML = `<span class="err">${e.message}</span>`;
  }
  btn.disabled = false;
});

// --- Threshold slider wiring ---
const thresholdSlider = document.getElementById('threshold-slider');
const thresholdVal = document.getElementById('threshold-val');
thresholdSlider.addEventListener('input', () => {
  thresholdVal.textContent = parseFloat(thresholdSlider.value).toFixed(2);
  applyThresholdFilter();
});
caseSearch.addEventListener('input', applyThresholdFilter);

boot();
</script>
</body>
</html>
